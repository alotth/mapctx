name: Release Sync Engine

on:
  workflow_dispatch:
  push:
    tags:
      - "sync-v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./packages/sync-engine/package.json').version")
          test "$GITHUB_REF_NAME" = "sync-v$VERSION"

      - name: Build and test maintained packages
        run: npm test

      - name: Check package contents
        run: npm run pack:check --workspace @mapctx/sync-engine

      - name: Verify packed install
        run: npm run pack:smoke --workspace @mapctx/sync-engine

      - name: Publish to npm
        working-directory: packages/sync-engine
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
