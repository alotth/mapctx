<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Workspace V2</title>
    <link rel="stylesheet" href="workspaceV2.css">
</head>
<body>
    <div class="workspace-shell">
        <aside class="project-rail" aria-label="Projects">
            <button id="rail-toggle" class="rail-toggle" type="button" aria-label="Expand sidebar" aria-pressed="false">
                <span class="rail-mark" aria-hidden="true">M</span>
                <span class="rail-title">MapCtx</span>
                <span class="rail-chev" aria-hidden="true">›</span>
            </button>
            <div id="project-rail-list" class="project-rail-list"></div>
            <button id="project-add" class="project-add" type="button" aria-label="Add project" title="Add project">+</button>
        </aside>

        <div class="workspace-main">
            <header class="topbar">
                <div class="title-group">
                    <h1 id="board-title">Workspace V2</h1>
                    <span id="board-mode" class="mode-badge">Model: unknown</span>
                    <span id="board-meta"></span>
                    <button id="target-edit" class="target-edit-button" type="button" hidden>Edit</button>
                </div>
                <div class="view-switcher">
                    <button id="tab-kanban" class="tab active" type="button">Kanban</button>
                    <button id="tab-roadmap" class="tab" type="button">Roadmap</button>
                    <button id="tab-execution" class="tab" type="button">Execution</button>
                </div>
            </header>

            <main>
                <section id="kanban-view" class="view active"></section>
                <section id="roadmap-view" class="view"></section>
                <section id="execution-view" class="view"></section>
            </main>
        </div>
    </div>

    <div id="detail-modal" class="modal" aria-hidden="true">
        <div class="modal-backdrop" data-close-modal="detail"></div>
        <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="detail-modal-title">
            <header class="modal-head">
                <h2 id="detail-modal-title">Task detail</h2>
                <button class="modal-close" data-close-modal="detail" type="button">Close</button>
            </header>
            <div id="detail-modal-content" class="modal-content"></div>
        </section>
    </div>

    <div id="project-modal" class="modal" aria-hidden="true">
        <div class="modal-backdrop" data-close-modal="project"></div>
        <section class="modal-panel project-modal-panel" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">
            <header class="modal-head">
                <div>
                    <p class="modal-kicker">Workspace registry</p>
                    <h2 id="project-modal-title">Add organization / project</h2>
                </div>
                <button class="modal-close" data-close-modal="project" type="button">Close</button>
            </header>
            <form id="project-form" class="project-form">
                <div class="form-grid">
                    <label>
                        <span>Organization name</span>
                        <input id="project-org-name" name="organizationName" autocomplete="organization" placeholder="e.g. Inlift">
                    </label>
                    <label>
                        <span>Organization id</span>
                        <input id="project-org-id" name="organizationId" placeholder="e.g. inlift">
                    </label>
                    <label class="wide">
                        <span>Organization folder</span>
                        <div class="path-row">
                            <input id="project-org-path" name="organizationPath" placeholder="/Users/you/repos/inlift">
                            <button class="secondary-button" type="button" data-browse-folder="project-org-path" data-browse-prompt="Choose organization folder">Browse</button>
                        </div>
                    </label>
                    <label class="project-only">
                        <span>Project name</span>
                        <input id="project-name" name="projectName" placeholder="e.g. audit_financeiro">
                    </label>
                    <label class="project-only">
                        <span>Project id</span>
                        <input id="project-id" name="projectId" placeholder="e.g. audit-financeiro">
                    </label>
                    <label class="wide project-only">
                        <span>Project folder with TASKS.md</span>
                        <div class="path-row">
                            <input id="project-path" name="projectPath" required placeholder="/Users/you/repos/inlift/audit_financeiro">
                            <button id="project-browse" class="secondary-button" type="button" data-browse-folder="project-path" data-browse-prompt="Choose project folder with TASKS.md">Browse</button>
                        </div>
                    </label>
                </div>
                <p class="form-hint">Browse opens the native folder picker when running through MapCtx or VS Code. You can also paste an absolute path.</p>
                <p id="project-form-message" class="form-message" aria-live="polite"></p>
                <footer class="form-actions">
                    <button class="secondary-button" data-close-modal="project" type="button">Cancel</button>
                    <button class="primary-button" type="submit">Add to workspace</button>
                </footer>
            </form>
        </section>
    </div>

    <script src="workspaceV2.js"></script>
</body>
</html>
